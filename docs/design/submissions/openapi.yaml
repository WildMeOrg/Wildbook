  /api/v3/submissions/{id}/files:
    get:
      operationId: getSubmissionFiles
      description: Complete staged images only.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted current revision.
        '400':
          description: Malformed request
          content:
