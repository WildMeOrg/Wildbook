        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Expired or cancelled draft during tombstone retention
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
    post:
      operationId: uploadSubmissionFile
      description: 'One image per request. Server computes digest. Serialize uploads;
        after a lost response GET manifest and reconcile name/digest and ETag. Same
        name/content at current revision is a retry success; differing content is
        409. Incomplete files are never visible. File.name equals the original multipart
        filename used in Encounter.mediaAssetN. Reject unsafe names or names requiring
        cleaning; never silently rename. Same-content retries do not advance revision.
        Pilot: JPEG/PNG, matching extension, max 200 files and 200 MiB completed bytes
        per draft; exceeding either returns 413. At most one additional bounded retry
        candidate exists during upload. Staging must be configured. Serialize uploads;
        processing contention returns 429.'
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted current revision.
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, key or content conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Input too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Input or validation unacceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Required revision precondition missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
        '408':
          description: Upload exceeded wall-clock limit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
  /api/v3/submissions/{id}/validate:
    post:
      operationId: validateSubmission
      description: Validate current revision without changing it. Validation failures,
        including empty rows, return 200 with valid=false and source-row issues. No
        domain objects are created.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'
          headers:
            ETag:
              schema:
                type: string
              description: Unchanged quoted input revision; use on commit.
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
