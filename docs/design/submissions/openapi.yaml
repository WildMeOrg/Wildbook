        '422':
          description: Input or validation unacceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Required revision precondition missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rows'
    get:
      operationId: getSubmissionRows
      description: Returns rows as accepted; compare by JSON value equality after
        a lost PUT response. GET the current ETag before another mutation. Rows remain
        readable during cancelled/expired tombstone retention.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Stored rows, or empty array before first PUT
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredRows'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
