            schema:
              $ref: '#/components/schemas/Validate'
  /api/v3/submissions/{id}/commit:
    post:
      operationId: commitSubmission
      description: Atomically freezes a validated draft and accepts at most one execution.
        Same keyed request returns the original acceptance before checking stale If-Match.
        A different key cannot queue a second execution. Invalid validation returns
        422 VALIDATION_INVALID; stale validation/config returns 409 VALIDATION_STALE;
        a different key after acceptance returns 409 ALREADY_COMMITTED. After admission
        shutdown recover via GET status/results; mutation retries may return 503 instead
        of replaying 202.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          headers:
            Location:
              schema:
                type: string
              description: Resource or status URL.
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, key or content conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Input too large
          content:
            application/json:
