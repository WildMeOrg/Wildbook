openapi: 3.0.3
info:
  title: Wildbook Submissions API (draft, not deployed)
  version: 1.0.0-draft
  description: 'Sibling intake API. Private enrolled-partner pilot; detection and identification by
    default. Existing bulk-import endpoints are unchanged. Bearer credentials must
    contain an explicitly issued submissions capability; existing identity-only tokens
    do not authorize intake. Session writes require CSRF protection when enabled.
    All limits and retention are installation-configured. Responses carrying private
    draft data use Cache-Control: no-store. Relevant configuration and permissions
    are rechecked before execution.'
servers:
- url: /
security:
- submissionBearer: []
paths:
  /api/v3/submissions/capabilities:
    get:
      operationId: submissionCapabilities
      description: Returns limits and implemented capabilities for this installation
        and principal.
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
  /api/v3/submissions:
    post:
      operationId: createSubmission
      description: 'Creates a private draft. Replays return the original 201 body
        and resource URL. Omitted processing is detect-and-identify. The replayed body/ETag
        may be old: GET the resource before any mutation.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted current revision.
            Location:
              schema:
                type: string
              description: Resource or status URL.
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, key or content conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Input too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Input or validation unacceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create'
  /api/v3/submissions/{id}:
    get:
      operationId: getSubmission
      description: Returns the current durable status; queued and in-flight jobs remain
        inspectable when new admission is disabled. Owners receive 200 with cancelled
        or expired state during tombstone retention; 404 after final purge.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted current revision.
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
    delete:
      operationId: cancelSubmission
      description: Cancels only draft or validated state. After owner checks, already-cancelled
        state returns 204 regardless of the supplied If-Match (even if stale). The
        If-Match header is always required, but its value is not compared on repeated
        cancellation. All queued/importing/imported/failed/needs_reconciliation/expired
        states return 409. This never deletes biological records.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Success
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not enrolled or not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota or concurrency limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '503':
          description: Feature temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, key or content conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Required revision precondition missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure; retry only according to operation idempotency
            rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed; Allow header lists supported methods
  /api/v3/submissions/{id}/rows:
    put:
      operationId: replaceSubmissionRows
      description: Replaces all rows; unique clientRowId values required. Invalidates
        prior validation.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          headers:
            ETag:
              schema:
                type: string
              description: Quoted current revision.
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid
          content:
            application/json:
              schema:
