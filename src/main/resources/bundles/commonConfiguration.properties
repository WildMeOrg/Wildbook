# Concurrent IA match-consumer threads on the IA queue. Default 1 (serial).
# Applied to the IA queue only (detection stays serial) so the aggregate stays <= N+1.
# Raising this increases match throughput but also concurrent load on OpenSearch,
# the DB connection pool, and the ml-service. Requires a filesystem that supports atomic
# file moves (validated at startup; clamped to 1 if not). Safe range 1-8; size against DB
# pool free connections and OpenSearch page-cache headroom before raising.
iaMatchConsumerThreads = 1

# ---- interactive ("fastlane") match lane -------------------------------------
# An encounter-page "New Match" is published with fastlane=true. Historically that meant
# the DETECTION queue, which is deliberately SERIAL (one consumer) and whose handler blocks
# for a full synchronous ml-service round trip -- so a bulk detection backlog stalled
# interactive matching for as long as it took to drain.
#
# Enabling this routes those interactive matches (v2 annotation intake and legacy identify)
# onto their own concurrent queue instead. ml-service detection jobs are unaffected and stay
# on the serial detection lane, which is the throughput gate protecting the GPU.
#
# DEFAULT OFF -- opt in per install. Enabling raises this instance's concurrency, and the
# readiness flag only proves the consumer registered at startup, not that it is still alive.
# Before enabling: confirm "fastlaneQ.consume() started" in the log, then watch the
# wildbook_queue_fastlane gauge (or appadmin/wildbookIAQueueStats.jsp) rise and fall.
# To roll back: set false and RESTART -- context properties are cached, so editing this file
# alone will not flip a running publisher. Consumers start regardless of this flag so an
# install that disables it still drains whatever it already published. Messages mid-handler
# at restart can be lost (pre-existing FileQueue behaviour, all lanes).
iaFastlaneQueueEnabled = false

# Concurrent consumers on the fastlane queue. Default 2. Same atomic-move gate and 1-8 clamp
# as iaMatchConsumerThreads. NB a fastlane match is not purely OpenSearch: when an annotation
# has no embedding, Embedding.findMatchProspects extracts one inline via ml-service /extract/
# (legacy HTTP path, 300s timeouts), so this value also caps extra ml-service concurrency
# outside the serial detection gate.
iaFastlaneConsumerThreads = 2

# Threads for bulk re-identification (parallel per-encounter matching in resendBulkImportID).
# Default 1 = serial (unchanged). Each worker holds its own DB connection; size the pool >= N + web
# baseline. Requires the stateless match search from the vector-match-throughput work (PR #1676).
# App-scoped bound: this many workers total across all concurrent bulk-reID requests. Clamped to
# [1, min(16, cpu cores)] -- throughput regresses past ~cores. A change needs an app restart.
iaMatchThreads = 1


