# these might need adjusting if background indexing seems to be taking longer than the delay time
#backgroundDelayMinutes=20
#backgroundSliceSize=2500

# The permissions audit verifies the ACL fields of every encounter, annotation and individual
# document against the database on a fixed schedule (nothing signals it): this many minutes
# after the previous audit completed, or the retry delay after an incomplete one (at most five
# retries in a row). Raising the interval lowers load and lengthens how long a revoked grant
# can remain visible to token-authenticated annotation/individual search.
#backgroundPermissionsMinutes=10
#backgroundPermissionsRetryMinutes=2
# Exactly one JVM per database may run the audit. With several Tomcats on one database set
# this to false on all but one.
#backgroundPermissionsRunner=true
# Scroll page size, conditional ACL writes per audit, child rebuilds per audit, scroll keep-alive.
#backgroundPermissionsPageSize=1000
#backgroundPermissionsMaxRepairsPerPass=20000
#backgroundPermissionsMaxRebuildsPerPass=500
#backgroundPermissionsScrollKeepAlive=5m


# these probably should not be adjusted
#searchScrollTime=10m
#searchPitTime=10m

indexingNumAllowedThreads = 20
