  /api/v3/search/{indexName}:
    post:
      tags:
        - Search
      summary: Search index
      description: |
        Execute a search query against the specified index.
        Note: annotation index requires admin privileges.
      operationId: searchIndex
      security:
        - cookieAuth: []
      parameters:
        - name: indexName
          in: path
          required: true
          schema:
            type: string
            enum: [encounter, individual, occurrence, annotation, sighting, user]
          description: Name of the index to search
        - name: from
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
        - name: size
          in: query
          schema:
            type: integer
            default: 10
          description: Number of results to return
        - name: sort
          in: query
          schema:
            type: string
          description: Sort field
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQuery'
      responses:
        '200':
          description: Search results
          headers:
            X-Wildbook-Total-Hits:
              schema:
                type: integer
              description: Total number of matching documents
            X-Wildbook-Search-Query-Id:
              schema:
                type: string
                format: uuid
              description: Stored query ID for reuse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (admin required for annotation index)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: integer
                    example: 403
        '404':
          description: Unknown index or invalid searchQueryId
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          description: Query execution failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "query failed"

