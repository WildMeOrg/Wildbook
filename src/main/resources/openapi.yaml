openapi: 3.0.3
info:
  title: Wildbook v3 API
  version: 3.0.3
  description: |
    API for the Wildbook® photo-identification platform.
    
    This API provides endpoints for wildlife data management including encounters,
    individuals, media assets, and advanced search capabilities.
    
    ## Authentication
    The API uses session-based authentication via Apache Shiro. Users must login
    via `/api/v3/login` to obtain a session cookie (JSESSIONID).
    
    ## ReCAPTCHA
    Some endpoints (notably encounter creation) require ReCAPTCHA validation
    for anonymous submissions.

servers:
  - url: /
    description: Application server root
  - url: https://api.wildbook.org
    description: Production server (example)
  - url: http://localhost:8080
    description: Development server

tags:
  - name: Authentication
    description: User login, logout, and session management
  - name: User
    description: User profile and dashboard operations
  - name: Encounters
    description: Wildlife encounter management
  - name: Individuals
    description: Individual animal management
  - name: Occurrences
    description: Occurrence/sighting management
  - name: Annotations
    description: Image annotation management
  - name: MediaAssets
    description: Image and video asset management
  - name: Projects
    description: Research project management
  - name: Search
    description: Advanced search operations using OpenSearch/Elasticsearch
  - name: BulkImport
    description: Bulk data import operations
  - name: BulkExport
    description: Bulk data export operations
  - name: SiteSettings
    description: Site configuration and settings

components:
  securitySchemes:
    submissionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Explicit submissions:read or submissions:write capability. Mutations
        require write scope and current pilot enrollment. Browser cookie fallback is disabled.
    submissionBasic:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie obtained via login endpoint

  responses:
    Unauthorized:
      description: Authentication required or invalid session
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "access denied"
              statusCode:
                type: integer
                example: 401

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "not found"
              statusCode:
                type: integer
                example: 404

    BadRequest:
      description: Invalid request parameters or data
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              statusCode:
                type: integer
                example: 400
              errors:
                type: array
                items:
                  type: object
                  properties:
                    fieldName:
                      type: string
                    code:
                      type: string
                    message:
                      type: string
              debug:
                type: string
                description: Debug information (development only)

    MethodNotAllowed:
      description: HTTP method not allowed for this endpoint
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "method not allowed"
              statusCode:
                type: integer
                example: 405

  parameters:
    SubmissionApiIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]{1,18}"$
      description: Quoted current revision; 428 when absent, 412 when stale.
    SubmissionApiIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Scoped to context, authenticated principal and operation. Same input
        replays the original response; changed input is 409.
    SubmissionApiSubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SubmissionApiSubmission:
      type: object
      additionalProperties: true
      required:
      - id
      - contractVersion
      - revision
      - state
      - source
      - processing
      - createdAt
      - expiresAt
      - rowCount
      properties:
        id:
          type: string
          format: uuid
        contractVersion:
          type: string
          enum:
          - '1'
        revision:
          type: integer
          minimum: 0
        state:
          type: string
          enum:
          - draft
          - validated
          - queued
          - importing
          - imported
          - failed
          - needs_reconciliation
          - cancelled
          - expired
        source:
          $ref: '#/components/schemas/SubmissionApiSource'
        processing:
          $ref: '#/components/schemas/SubmissionApiProcessing'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        importTaskId:
          type: string
          format: uuid
        validationId:
          type: string
          format: uuid
        rowsDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Server-generated informational SHA-256 digest. Clients reconcile
            by GET rows and JSON value equality, not by reproducing this digest.
        rowCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiIssue'
        derivatives:
          $ref: '#/components/schemas/SubmissionApiPhase'
    SubmissionApiRows:
      type: object
      additionalProperties: false
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiRow'
          minItems: 1
          maxItems: 200
    SubmissionApiSource:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        batchId:
          type: string
          minLength: 1
          maxLength: 256
    SubmissionApiProcessing:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - import-only
          - detect-and-identify
          default: detect-and-identify
      description: Omit the entire processing object to select detect-and-identify. Explicit import-only skips detection and identification. When provided,
        mode is required.
    SubmissionApiValidation:
      type: object
      additionalProperties: true
      required:
      - id
      - submissionId
      - revision
      - valid
      - configDigest
      - manifestDigest
      - errors
      - warnings
      - normalizedRows
      - effectiveOwnerId
      - processing
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        valid:
          type: boolean
        configDigest:
          type: string
          minLength: 1
        manifestDigest:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiIssue'
        normalizedRows:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiRow'
        effectiveOwnerId:
          type: string
          format: uuid
        processing:
          $ref: '#/components/schemas/SubmissionApiProcessing'
    SubmissionApiValidate:
      type: object
      additionalProperties: false
      properties: {}
      description: Empty object; If-Match selects the input revision.
    SubmissionApiResults:
      type: object
      additionalProperties: true
      required:
      - submissionId
      - state
      - indexing
      - detection
      - identification
      - rows
      - errors
      properties:
        submissionId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - draft
          - validated
          - queued
          - importing
          - imported
          - failed
          - needs_reconciliation
          - cancelled
          - expired
        indexing:
          $ref: '#/components/schemas/SubmissionApiPhase'
        detection:
          $ref: '#/components/schemas/SubmissionApiPhase'
        identification:
          $ref: '#/components/schemas/SubmissionApiPhase'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiResultRow'
        nextCursor:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiIssue'
        links:
          type: object
          additionalProperties:
            type: string
          description: Authorized task and record URL links; clients must not construct
            page paths from IDs.
        derivatives:
          $ref: '#/components/schemas/SubmissionApiPhase'
    SubmissionApiPhase:
      type: object
      additionalProperties: true
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - pending
          - running
          - not_started
          - dispatching
          - dispatched
          - complete
          - failed
          - skipped
          - unknown
          description: Indexing unknown means submitted to the existing async indexing
            queue; no completion acknowledgment is available. Derivatives unknown requires
            operator reconciliation.
        message:
          type: string
          minLength: 1
    SubmissionApiManifest:
      type: object
      additionalProperties: true
      required:
      - submissionId
      - revision
      - files
      properties:
        submissionId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        files:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiFile'
    SubmissionApiCommit:
      type: object
      additionalProperties: false
      required:
      - validationId
      properties:
        validationId:
          type: string
          format: uuid
    SubmissionApiError:
      type: object
      additionalProperties: true
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - AUTHENTICATION_REQUIRED
          - ACCESS_DENIED
          - NOT_FOUND
          - GONE
          - PRECONDITION_REQUIRED
          - REVISION_STALE
          - IDEMPOTENCY_KEY_REUSED
          - ALREADY_COMMITTED
          - VALIDATION_STALE
          - VALIDATION_INVALID
          - INVALID_STATE
          - LIMIT_EXCEEDED
          - ADMISSION_DISABLED
          - DUPLICATE_CLIENT_ROW_ID
          - FILE_CONTENT_CONFLICT
          - INTERNAL_ERROR
          - CAPABILITY_UNAVAILABLE
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiIssue'
      description: DUPLICATE_CLIENT_ROW_ID is 422; INVALID_STATE is 409; PRECONDITION_REQUIRED
        is 428; REVISION_STALE is 412; IDEMPOTENCY_KEY_REUSED and ALREADY_COMMITTED are
        409; LIMIT_EXCEEDED is 413 for input size or 429 for quotas; ADMISSION_DISABLED
        is 503.
    SubmissionApiIssue:
      type: object
      additionalProperties: true
      required:
      - code
      - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        clientRowId:
          type: string
          minLength: 1
        rowIndex:
          type: integer
          minimum: 0
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
          description: >-
            Present on INVALID_VALUE issues: why the value was rejected. One of REQUIRED,
            REQUIRES_FIELD, UNPARSEABLE, OUT_OF_RANGE, FUTURE_DATE, NOT_CONFIGURED, INVALID.
            New reasons may be added; treat an unknown reason as INVALID.
          x-known-values:
          - REQUIRED
          - REQUIRES_FIELD
          - UNPARSEABLE
          - OUT_OF_RANGE
          - FUTURE_DATE
          - NOT_CONFIGURED
          - INVALID
        limit:
          type: number
    SubmissionApiCapabilities:
      type: object
      additionalProperties: true
      required:
      - contractVersion
      - admissionEnabled
      - commitEnabled
      - processingModes
      - authentication
      - limits
      - rowFields
      properties:
        contractVersion:
          type: string
          enum:
          - '1'
        admissionEnabled:
          type: boolean
        commitEnabled:
          type: boolean
        processingModes:
          type: array
          items:
            type: string
            enum:
            - import-only
            - detect-and-identify
        authentication:
          type: array
          items:
            type: string
            enum:
            - bearer
        limits:
          type: object
          additionalProperties: false
          required:
          - maxRows
          - maxFileBytes
          - maxRequestBytes
          - maxDraftBytes
          - maxMediaPerEncounter
          - maxActiveJobs
          - draftTtlSeconds
          - idempotencyRetentionSeconds
          properties:
            maxRows:
              type: integer
              minimum: 1
            maxFileBytes:
              type: integer
              minimum: 1
            maxRequestBytes:
              type: integer
              minimum: 1
            maxDraftBytes:
              type: integer
              minimum: 1
            maxMediaPerEncounter:
              type: integer
              minimum: 1
            maxActiveJobs:
              type: integer
              minimum: 1
            draftTtlSeconds:
              type: integer
              minimum: 1
            idempotencyRetentionSeconds:
              type: integer
              minimum: 1
              description: Minimum guaranteed retention. The pilot retains records indefinitely;
                no automatic database purge.
            maxFieldsPerRow:
              type: integer
              enum:
              - 256
            maxDraftsPerUser:
              type: integer
              enum:
              - 20
            maxNewDraftsPerDay:
              type: integer
              enum:
              - 20
              description: Per owner in a rolling 24-hour window; cancellation does not
                refund this budget.
        rowFields:
          type: object
          additionalProperties: true
          properties:
            supported:
              type: array
              items:
                type: string
            required:
              type: array
              items:
                type: string
            indexedMedia:
              type: string
        stagingAvailable:
          type: boolean
        maxFiles:
          type: integer
          enum:
          - 200
        maxImagePixels:
          type: integer
          enum:
          - 24000000
        uploadMediaTypes:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            type: string
    SubmissionApiAccepted:
      type: object
      additionalProperties: true
      required:
      - submissionId
      - operationId
      - importTaskId
      - acceptedRevision
      - statusUrl
      properties:
        submissionId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        importTaskId:
          type: string
          format: uuid
        acceptedRevision:
          type: integer
          minimum: 0
        statusUrl:
          type: string
          minLength: 1
    SubmissionApiStoredRows:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionApiRow'
      required:
      - rows
      additionalProperties: true
    SubmissionApiFile:
      type: object
      additionalProperties: true
      required:
      - name
      - sizeBytes
      - sha256
      - state
      - mediaType
      properties:
        name:
          type: string
          minLength: 1
          description: Exact accepted multipart filename; also the row reference.
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          type: string
          enum:
          - complete
        mediaType:
          type: string
          minLength: 1
    SubmissionApiCreate:
      type: object
      additionalProperties: false
      required:
      - contractVersion
      - source
      properties:
        contractVersion:
          type: string
          enum:
          - '1'
        source:
          $ref: '#/components/schemas/SubmissionApiSource'
        processing:
          $ref: '#/components/schemas/SubmissionApiProcessing'
    SubmissionApiResultRow:
      type: object
      additionalProperties: true
      required:
      - clientRowId
      - encounterIds
      - occurrenceIds
      - individualIds
      - mediaAssetIds
      properties:
        clientRowId:
          type: string
          minLength: 1
        encounterIds:
          type: array
          items:
            type: string
            format: uuid
        occurrenceIds:
          type: array
          items:
            type: string
            minLength: 1
        individualIds:
          type: array
          items:
            type: string
            minLength: 1
        mediaAssetIds:
          type: array
          items:
            type: integer
            minimum: 0
    SubmissionApiRow:
      type: object
      additionalProperties: false
      required:
      - clientRowId
      - fields
      properties:
        clientRowId:
          type: string
          minLength: 1
          maxLength: 128
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: boolean
          description: Normalized bulk-import field names. Actual supported fields, required
            values and types are supplied by capabilities. Nulls and unknown fields are
            rejected in this contract.
          maxProperties: 256
    LoginCredentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "securePassword123"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        redirectUrl:
          type: string
          format: uri
          description: URL to redirect to after successful login (if applicable)
        # Additional user info fields from User.infoJSONObject()
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        emailAddress:
          type: string
        affiliation:
          type: string
        profilePhotoUUID:
          type: string
          format: uuid
        isAdmin:
          type: boolean
        organizations:
          type: array
          items:
            type: object

    User:
      type: object
      description: User profile information from User.infoJSONObject()
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        emailAddress:
          type: string
        affiliation:
          type: string
        profilePhotoUUID:
          type: string
          format: uuid
        isAdmin:
          type: boolean
        organizations:
          type: array
          items:
            type: object

    UserHome:
      type: object
      description: User dashboard data
      properties:
        user:
          $ref: '#/components/schemas/User'
        latestEncounters:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              date:
                type: string
                format: date-time
              numberAnnotations:
                type: integer
              taxonomy:
                type: string
        latestBulkImportTask:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            dateTimeCreated:
              type: string
              format: date-time
            numberEncounters:
              type: integer
            numberMediaAssets:
              type: integer
        latestIndividual:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            dateTime:
              type: string
              format: date-time
        latestMatchTask:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            dateTimeCreated:
              type: string
              format: date-time
            encounterId:
              type: string
              format: uuid
              nullable: true
        projects:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ProjectSummary'

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        percentComplete:
          type: number
          format: double
        numberEncounters:
          type: integer

    BaseObjectCreate:
      type: object
      description: Payload for creating Encounters, Individuals, Occurrences, or Annotations
      required:
        - submissionId
      properties:
        submissionId:
          type: string
          format: uuid
          description: UUID linking to uploaded files via ResumableUpload
        assetFilenames:
          type: array
          items:
            type: string
          example: ["image1.jpg", "image2.png"]
          description: List of filenames from the upload session
        # Additional fields depend on object type (Encounter, Individual, etc.)

    BaseObjectResponse:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        id:
          type: string
          format: uuid
          description: UUID of the created object
        class:
          type: string
          enum: [encounters, individuals, occurrences, annotations]
        assets:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              id:
                type: integer
              uuid:
                type: string
                format: uuid
              url:
                type: string
                format: uri
        invalidFiles:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
        locationId:
          type: string
          description: For encounters only
        submissionDate:
          type: string
          format: date-time
          description: For encounters only
        errors:
          type: array
          items:
            type: object
        debug:
          type: string

    MediaAssetInfo:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        url:
          type: string
          format: uri
        width:
          type: integer
        height:
          type: integer
        rotationInfo:
          type: object
        annotations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              encounterId:
                type: string
                format: uuid
              encounterTaxonomy:
                type: string
              trivial:
                type: boolean
              x:
                type: integer
              y:
                type: integer
              width:
                type: integer
              height:
                type: integer

    SearchQuery:
      type: object
      description: OpenSearch/Elasticsearch query body
      additionalProperties: true

    SearchResponse:
      type: object
      properties:
        success:
          type: boolean
        searchQueryId:
          type: string
          format: uuid
        hits:
          type: array
          items:
            type: object
            additionalProperties: true
        query:
          $ref: '#/components/schemas/SearchQuery'

    PatchOperation:
      type: object
      description: JSON Patch operation (RFC 6902)
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum: [add, remove, replace, move, copy]
          description: The operation to perform
        path:
          type: string
          description: |
            JSON Pointer to the field to modify. Supported paths for Encounters include:
            individualId, occurrenceId, assets, acousticTag, satelliteTag, metalTags,
            measurements, annotations, and standard encounter fields (genus, specificEpithet,
            year, month, day, hour, minutes, sex, lifeStage, country, locationId, verbatimLocality,
            decimalLatitude, decimalLongitude, behavior, etc.)
          example: "/locationId"
        value:
          description: The value for add/replace operations (type depends on the path)
        from:
          type: string
          description: Source path for move/copy operations

    PatchResponse:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        patchResults:
          type: array
          items:
            type: object
            properties:
              _patch:
                type: object
                description: The original patch operation that was applied

paths:
  /api/v3/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and create session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    enum: [invalid_credentials, login_empty_data]

    get:
      tags:
        - Authentication
      summary: Process login (alternate method)
      description: Some implementations support GET for login processing
      operationId: loginGet
      deprecated: true
      responses:
        '200':
          description: Method supported but POST preferred
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v3/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: End user session and invalidate cookie
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

    get:
      tags:
        - Authentication
      summary: User logout (alternate method)
      description: GET method also supported for logout
      operationId: logoutGet
      security:
        - cookieAuth: []
      responses:
